<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rol de propiedad → Certificado de deuda TGR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.1.4/dist/leaflet-rotate-src.js"></script>
<script src="comunas.js"></script>
<style>
  :root{
    --ink:#2a1a1f;
    --paper:#fbf3f6;
    --line:#e6c9d6;
    --moss:#7c1f3e;
    --moss-dark:#54142a;
    --clay:#e2007a;
    --clay-dark:#b8005f;
    --leather:#2c1c16;
    --panel:#ffffff;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:1.1rem 1.4rem 0.9rem;
    border-bottom:2px solid var(--clay);
    background:linear-gradient(120deg, #fdf1f6 0%, #fbe1ee 55%, #f7d4e8 100%);
    display:flex;
    align-items:center;
    gap:0.9rem;
    flex-wrap:wrap;
  }
  header .titles{
    display:flex;
    flex-direction:column;
    gap:0.2rem;
  }
  header h1{
    font-family:'Luckiest Guy', 'Iowan Old Style', cursive;
    font-size:1.9rem;
    margin:0;
    font-weight:400;
    letter-spacing:0.02em;
    color:var(--clay);
    text-shadow:2px 2px 0 var(--moss-dark);
    transform:rotate(-1.5deg);
    display:inline-block;
  }
  header p{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.82rem;
    color:#7a5a68;
  }
  .mascot-wrap{
    margin:-1.1rem -1.1rem 1.1rem;
    overflow:hidden;
    border-bottom:2px solid var(--clay);
  }
  #mascot{
    display:block;
    width:100%;
    height:230px;
    object-fit:cover;
    object-position:50% 18%;
    user-select:none;
    -webkit-user-drag:none;
  }
  main{
    flex:1;
    display:grid;
    grid-template-columns: minmax(0,1fr) 320px;
    min-height:0;
    transition: grid-template-columns 0.25s ease;
  }
  main.panel-hidden{
    grid-template-columns: minmax(0,1fr) 0px;
  }
  main.panel-hidden aside{
    padding:0;
    border-left:none;
    overflow:hidden;
  }
  .rotate-btn{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    line-height:1;
    background:var(--panel);
    color:var(--moss-dark);
    text-decoration:none;
    user-select:none;
  }
  .rotate-btn:hover{ background:var(--paper); }
  .rotate-arrow{
    font-size:1rem;
    transition:transform 0.2s ease;
  }
  .rotate-label{
    font-size:0.55rem;
    font-weight:bold;
    letter-spacing:0.03em;
  }
  .locate-btn{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
    color:var(--moss-dark);
    text-decoration:none;
    font-size:1.05rem;
    user-select:none;
  }
  .locate-btn:hover{ background:var(--paper); }
  .locate-btn.cargando{ animation:locate-pulso 1s ease-in-out infinite; }
  @keyframes locate-pulso{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.35; }
  }
  /* ---- Buscador de direcciones (sobre el mapa) ---- */
  #buscador{
    position:absolute;
    top:12px;
    left:56px;
    right:58px;
    max-width:420px;
    z-index:1000;
    font-family:inherit;
  }
  #buscador form{
    display:flex;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  #buscador input{
    flex:1;
    min-width:0;
    border:none;
    padding:0.5rem 0.7rem;
    font:inherit;
    font-size:0.9rem;
    color:var(--ink);
    background:transparent;
  }
  #buscador input:focus{ outline:none; }
  #buscador form:focus-within{ border-color:var(--clay); }
  #buscador button[type="submit"]{
    border:none;
    border-left:1px solid var(--line);
    background:var(--paper);
    color:var(--moss-dark);
    padding:0 0.8rem;
    font:inherit;
    font-size:0.85rem;
    cursor:pointer;
  }
  #buscador button[type="submit"]:hover{ background:var(--line); }
  #buscador-resultados{
    margin:4px 0 0;
    padding:0;
    list-style:none;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    max-height:260px;
    overflow-y:auto;
  }
  #buscador-resultados:empty{ display:none; }
  #buscador-resultados li button{
    display:block;
    width:100%;
    text-align:left;
    border:none;
    background:none;
    padding:0.5rem 0.7rem;
    font:inherit;
    font-size:0.82rem;
    line-height:1.35;
    color:var(--ink);
    cursor:pointer;
  }
  #buscador-resultados li + li button{ border-top:1px solid var(--paper); }
  #buscador-resultados li button:hover,
  #buscador-resultados li button:focus{ background:var(--paper); outline:none; }
  #buscador-resultados li button strong{ display:block; font-size:0.88rem; }
  #buscador-resultados .precision{
    display:block;
    margin-top:0.15rem;
    font-size:0.72rem;
    color:#7a5a68;
  }
  #buscador-resultados .precision-exacta{ color:#2f8e5a; }
  #buscador-resultados .precision-calle{ color:#a3402b; }
  #buscador-resultados li.aviso{
    padding:0.5rem 0.7rem;
    font-size:0.82rem;
    color:#7a5a68;
  }
  #panel-toggle{
    position:absolute;
    top:12px;
    right:12px;
    z-index:1000;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--moss-dark);
    font-size:1.05rem;
    line-height:1;
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  #map{
    width:100%;
    height:100%;
    background:#1a1a1a;
  }
  aside{
    border-left:1px solid var(--line);
    background:var(--panel);
    padding:1.1rem;
    overflow-y:auto;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .field{
    margin-bottom:1rem;
  }
  .field label{
    display:block;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#9a6f80;
    margin-bottom:0.35rem;
  }
  select{
    width:100%;
    padding:0.5rem 0.6rem;
    font-size:0.92rem;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
    font-family:inherit;
  }
  .status{
    margin-top:0.9rem;
    font-size:0.85rem;
    color:#7a5a68;
  }
  .status.error{ color:#a3402b; }
  .layers-box{
    margin-bottom:1rem;
    padding:0.7rem 0.8rem;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper);
  }
  .layers-box .layers-title{
    display:block;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#9a6f80;
    margin-bottom:0.5rem;
  }
  .layer-toggle{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.85rem;
    color:var(--ink);
    padding:0.25rem 0;
    cursor:pointer;
    user-select:none;
  }
  .layer-toggle input{
    width:15px;
    height:15px;
    accent-color:#a3402b;
    cursor:pointer;
  }
  .layer-toggle .swatch{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
  }
  .layer-toggle .swatch.poligonos{ border-radius:2px; }
  .opacity-row{
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-size:0.78rem;
    color:#7a8880;
    padding:0.2rem 0 0.1rem 1.55rem;
  }
  .opacity-row label{
    white-space:nowrap;
  }
  .opacity-row input[type="range"]{
    flex:1;
    accent-color:#a3402b;
    cursor:pointer;
  }
  .layer-loading{
    font-size:0.75rem;
    color:#9a6f80;
    margin-left:1.6rem;
  }
  .leaflet-tooltip.avaluo-label{
    background:var(--clay);
    color:#fff;
    border:none;
    font-weight:600;
    font-size:0.75rem;
    padding:2px 7px;
    border-radius:3px;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }
  .leaflet-tooltip.avaluo-label::before{ border-top-color:var(--clay); }
  .deslindes-list{
    list-style:none;
    margin:0.4rem 0 0;
    padding:0.3rem 0 0;
    border-top:1px dashed var(--line);
  }
  .deslindes-list:empty{ display:none; }
  .deslindes-list li{
    display:flex;
    align-items:center;
    gap:0.4rem;
    padding:0.2rem 0;
    font-size:0.8rem;
    color:var(--ink);
  }
  .deslindes-list li input[type="checkbox"]{
    width:14px;
    height:14px;
    accent-color:#a3402b;
    cursor:pointer;
    flex-shrink:0;
  }
  .deslindes-list li .nombre{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .deslindes-list li .quitar{
    border:none;
    background:none;
    color:#9a6f80;
    font-size:0.95rem;
    line-height:1;
    padding:0.1rem 0.3rem;
    cursor:pointer;
  }
  .deslindes-list li .quitar:hover{ color:var(--clay); }
  .monumento-popup{ font-size:0.85rem; line-height:1.4; max-width:240px; }
  .monumento-popup h4{ margin:0 0 0.3rem; font-size:0.9rem; }
  .monumento-popup dl{ margin:0; }
  .monumento-popup dt{ font-weight:600; color:#7a5a68; float:left; clear:left; margin-right:0.3rem; }
  .monumento-popup dd{ margin:0 0 0.15rem; }
  .monumento-popup a{ color:#a3402b; }
  .result{
    margin-top:0.9rem;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    display:none;
  }
  .result.visible{ display:block; }
  .result-rol{
    background:var(--moss);
    color:#fbf9f2;
    padding:0.9rem 1rem;
  }
  .result-rol .label{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    opacity:0.75;
  }
  .result-rol .value{
    font-size:1.5rem;
    font-weight:600;
    margin-top:0.15rem;
    letter-spacing:0.01em;
  }
  dl.details{
    margin:0;
    padding:0.85rem 1rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.83rem;
  }
  dl.details div{
    display:flex;
    justify-content:space-between;
    gap:0.6rem;
    padding:0.32rem 0;
    border-bottom:1px solid #f0ede3;
  }
  dl.details div:last-child{ border-bottom:none; }
  dl.details dt{ color:#9a6f80; }
  dl.details dd{ margin:0; text-align:right; }
  .actions{
    padding:0.85rem 1rem 1rem;
    display:flex;
    flex-direction:column;
    gap:0.55rem;
  }
  button.primary{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.9rem;
    font-weight:600;
    padding:0.65rem 0.8rem;
    background:var(--clay);
    color:#fff;
    border:none;
    border-radius:4px;
    cursor:pointer;
  }
  button.primary:hover{ background:var(--clay-dark); }
  button.primary:active{ transform:translateY(1px); }
  button.secondary{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.9rem;
    font-weight:600;
    padding:0.65rem 0.8rem;
    background:#fff;
    color:var(--moss-dark);
    border:1.5px solid var(--moss);
    border-radius:4px;
    cursor:pointer;
  }
  button.secondary:hover{ background:#fbeef4; }
  button.secondary:active{ transform:translateY(1px); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }
  .copied{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.78rem;
    color:var(--moss-dark);
    display:none;
  }
  .copied.visible{ display:block; }
  .leaflet-container{ font-family:inherit; }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,10,14,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:1rem;
  }
  .modal-overlay.visible{ display:flex; }
  /* La ventana de unidades usa como marco la foto del edificio que diseñó el
     usuario (border-image): la cornisa del techo arriba, la puerta/zócalo
     abajo, y los pilares de ladrillo repetidos en los costados. */

    background:#efe6cf; /* respaldo por si queda algún borde sin cubrir */
    border-style:solid;
    border-width:28px 16px 52px 16px;
    border-image-source:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb0AAALkCAIAAAAUJXyxAAEAAElEQVR4nOz92ZMtWXYXDP7W2u5+TpyY7jxkZWVlZqWqsiaVSl9LoJZAMpNKtEwCrLv5QK2voRvDeMD4A6Q3/gLMeBFmwBPWDUaLfuABaKM1oI9PUKhRFSVqzKzKzMoacriZd4yIM/nea/XD2tvdzxjuJ+LGvZk6v0q7FXHi+Pbt7tt/e82LVBVbbLHFFlu0Bj/pCWyxxRZbfMCw5c0ttthii27Y8uYWW2yxRTdseXOLLbbYohu2vLnFFlts0Q1b3txiiy226IYtb26xxRZbdMOWN7fYYotuiF7HINuY+m32GKLLZ4GEJ1LGXbLcVtsscWHFCrBfmXm86LRc5M3RWQ4HD58+HA0GvV6PWYWkRACET0myt9iiy22WI8syyaTSZZlBwcHu7u7zMx8DsbJc+NNIvrGN77xj//xP37xxRcfPHjQ6/Xswybfb7HFFltcJEIIu7u7b7/99t/7e3/vC1/4gjHS2SW587Rvqupnn332ox/96LPPPgsghGCC8Vbe3GKLLS4eFflMJpNKCVZV59wZRz433gwhAOj1egcHB/ar934jxtQd026xxRZnBRGRwnvvvZ9MJkaa5zLyu?**Nota:** El archivo completo es demasiado largo para incluirlo íntegro en una sola respuesta sin cortes. ¿Quieres que te lo entregue en dos mensajes consecutivos (uno por archivo), o prefieres que aplique el cambio solo como un parche de las dos secciones a modificar (con el contexto suficiente para pegarlas tú)?
